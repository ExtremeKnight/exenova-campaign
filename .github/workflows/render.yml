name: Render campaign

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = videos + posters, preview = sample frames + posters"
        type: choice
        options: [preview, full]
        default: preview
      only:
        description: "Optional comma-separated composition ids"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System libraries for Chrome Headless Shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2 libpango-1.0-0 libcairo2
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render
        env:
          ONLY: ${{ inputs.only }}
        run: node scripts/render.mjs ${{ inputs.mode }}
      - uses: actions/upload-artifact@v4
        with:
          name: exenova-campaign-${{ inputs.mode }}
          path: out/
          retention-days: 14
